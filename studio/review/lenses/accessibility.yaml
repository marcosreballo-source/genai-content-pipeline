id: accessibility
name: Acessibilidade
question: Pessoas com necessidades diferentes conseguem usar?
applies_to:
- deck
- document
- web
criteria:
- id: ACC-1
  text: Contraste e tamanhos mínimos
  severity_hint: major
- id: ACC-2
