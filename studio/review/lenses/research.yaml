- id: RES-2
  text: Contribuição/novidade clara frente ao estado da arte
  severity_hint: blocker
- id: RES-3
  text: Metodologia descrita o suficiente para replicar
  severity_hint: major
- id: RES-4
  text: Avaliação com baselines, métricas, significância e ameaças à validade
