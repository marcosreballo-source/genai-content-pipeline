id: property-manual
name: Manual de convivência de imóvel
contexts:
- imóveis administrados
duration_rule:
  slides_per_min: 0.8
  min: 8
  max: 22
panel_default: manual-imovel
notes_required: false
sections:
- id: boas_vindas
  name: Boas-vindas
  required: true
  purpose: nome do imóvel e tom acolhedor
  suggested_archetypes:
  - title
  - statement
  slides:
  - 1
  - 2
- id: contatos
  name: Contatos
  required: true
  purpose: administração, emergências, portaria (do perfil do imóvel)
  suggested_archetypes:
  - table
  slides:
  - 1
  - 1
- id: regras_gerais
  name: Regras gerais
  required: true
  purpose: silêncio, áreas comuns, visitas
  suggested_archetypes:
  - bullets
  - table
  slides:
  - 1
  - 3
- id: areas_comuns
  name: Áreas comuns
  required: false
  purpose: regras e horários por área
  suggested_archetypes:
  - table
  - image
  slides:
  - 0
  - 3
- id: lixo
  name: Lixo e reciclagem
  required: true
  purpose: onde, quando e como
  suggested_archetypes:
  - process
  - image
  slides:
  - 1
  - 1
- id: seguranca
  name: Segurança e acesso
  required: true
  purpose: chaves, portões, visitantes, encomendas
  suggested_archetypes:
  - bullets
  - process
  slides:
  - 1
  - 2
- id: manutencao
  name: Manutenção
  required: true
  purpose: como pedir reparo e prazos
  suggested_archetypes:
  - process
  slides:
  - 1
  - 1
- id: animais_mudancas
  name: Animais, mudanças e obras
  required: false
  purpose: regras específicas
  suggested_archetypes:
  - bullets
  slides:
  - 0
  - 2
- id: penalidades
  name: Advertências e multas
  required: true
  purpose: conforme regimento/convenção
  suggested_archetypes:
  - table
  slides:
  - 1
  - 1
- id: especificos
  name: Particularidades deste endereço
  required: true
  purpose: tudo que é próprio do imóvel (do perfil)
  suggested_archetypes:
  - bullets
  - image
  - table
  slides:
  - 1
  - 3
- id: fechamento
  name: Contato e dúvidas
  required: true
  purpose: como falar com a administração
  suggested_archetypes:
  - closing
  slides:
  - 1
  - 1
principles:
- Toda regra específica vem do perfil do imóvel (property profile) ou do regimento; nunca inventada
- Tom acolhedor e direto
- Nada de dados pessoais de moradores
pitfalls:
- linguagem jurídica
- regra sem penalidade prevista
- contatos desatualizados
